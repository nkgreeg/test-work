services:
    app:
        build: .
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: "postgresql://app:ChangeMe@db:5432/app?serverVersion=16&charset=utf8"
        depends_on:
            - db
        command: sh -c "php bin/console doctrine:migrations:migrate --no-interaction && php -S 0.0.0.0:8000 -t public"

    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: app
            POSTGRES_PASSWORD: ChangeMe
            POSTGRES_USER: app
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    db_data:
